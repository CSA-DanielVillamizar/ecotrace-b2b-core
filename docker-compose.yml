services:
  postgres:
    image: postgres:16
    container_name: ecotrace-postgres
    environment:
      POSTGRES_USER: ecotrace
      POSTGRES_PASSWORD: ecotrace
      POSTGRES_DB: ecotrace_identity
    ports:
      - "5434:5432"
    volumes:
      - ecotrace-postgres-data:/var/lib/postgresql/data

volumes:
  ecotrace-postgres-data:
