<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoTrace Console</title>
  <meta name="description" content="Consola de referencia de EcoTrace B2B: cuatro Bounded Contexts que se relacionan solo por identificador.">
  <meta name="theme-color" content="#0A2C2C">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <div class="app">

        <div>
          <div class="brand-name">Eco<span>Trace</span></div>
          <div class="brand-sub">Console de referencia</div>

      </div>

      <nav id="navegacion" class="nav" aria-label="Secciones"></nav>

      <div class="sidebar-foot">
        <div>Trabajo 1 · ADR 0001<br>Bounded Contexts en código</div>
        <div class="docs-links" id="enlaces-docs" aria-label="Documentación Swagger de cada API"></div>
      </div>
    </aside>

    <main id="contenido" class="main" tabindex="-1">
      <div id="salud"></div>
      <div id="vista"></div>
    </main>
  </div>

  <div id="avisos" class="toasts" popover="manual" role="region" aria-label="Avisos"></div>

  <script type="module" src="/js/app.js"></script>
